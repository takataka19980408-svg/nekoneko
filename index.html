<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f1">
<meta name="description" content="地球上の約10億匹の猫から、ガチリアル確率で子猫に生まれ変わり、猫生を一歩ずつ歩む体験型シミュレーター。動く可愛い猫イラスト、成長、そして拾われる体験。野生のネコ科46種、純血種74種、世界78カ国。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>世界猫生ガチャ｜子猫で生まれて、猫生を歩む</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='52'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=20261123e">
</head>
<body>
<div class="floaties" aria-hidden="true"><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span></div>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🐾</span>
      <span class="brand-text">世界猫生ガチャ</span>
    </div>
    <button class="dex-btn" id="openDex" aria-label="転生猫図鑑を開く">
      <span>図鑑</span><span class="dex-badge" id="dexBadge">0</span>
    </button>
  </header>

  <main class="main">
    <!-- ホーム -->
    <section class="screen" id="homeScreen">
      <div class="hero">
        <p class="hero-kicker">子猫から、はじまる猫生</p>
        <h1 class="hero-title">きみは、どんな猫に<br><em>生まれる？</em></h1>
        <p class="hero-sub">飼い猫・地域猫・野良猫・野生のネコ科。<br>ぜんぶ混ぜて、ガチの確率で1匹。</p>
        <div class="hero-steps" aria-hidden="true">
          <span class="hero-step"><b>🐣</b>生まれる</span>
          <span class="hero-arrow">→</span>
          <span class="hero-step"><b>🐾</b>猫生を歩む</span>
          <span class="hero-arrow">→</span>
          <span class="hero-step"><b>🌈</b>見届ける</span>
        </div>
      </div>

      <div class="gacha-stage">
        <div class="preview" id="catPreview" aria-hidden="true"></div>
        <div class="roll-overlay" id="rollOverlay" hidden>
          <div class="roll-ring"></div>
          <div class="roll-ring roll-ring--2"></div>
          <div class="roll-paw">🐾</div>
          <div class="roll-flag" id="rollFlag">🌍</div>
          <div class="roll-text" id="rollText">転生先を探しています…</div>
          <div class="roll-sparks" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </div>

      <button class="primary" id="rollBtn">
        <span class="primary-label">🐾 ガチャを回す</span>
        <span class="primary-sub">子猫が生まれます</span>
      </button>

      <div class="home-meta">
        <div class="meta-item"><b id="statTotal">0</b><span>歩いた猫生</span></div>
        <div class="meta-item"><b id="statBest">—</b><span>最高レア</span></div>
        <div class="meta-item"><b id="statRate">0%</b><span>図鑑達成率</span></div>
      </div>

      <p class="disclaimer">※ 確率と生息数は各種統計・推計をもとにしたゲーム内の近似値です。</p>
    </section>

    <!-- 猫生を歩む -->
    <section class="screen screen--story" id="storyScreen" hidden>
      <div class="story-bar">
        <div class="paw-track" id="storyProgress" aria-hidden="true"></div>
        <button class="skip-btn" id="skipBtn">⏩ 一気に最期まで見る</button>
      </div>

      <div class="auto-bar" id="autoBar">
        <button class="auto-btn is-on" id="autoBtn" aria-pressed="true">
          <span class="auto-icon" id="autoBtnIcon">⏸</span><span id="autoBtnText">一時停止</span>
        </button>
        <div class="speed-group" role="group" aria-label="オートの速さ">
          <button class="speed-btn is-active" id="speed1" data-speed="1">1x</button>
          <button class="speed-btn" id="speed2" data-speed="2">2x</button>
        </div>
        <span class="auto-note" id="autoNote">2.5秒ごとに自動で進む</span>
      </div>

      <div class="stage" id="catStage">
        <div class="stage-scene scene--home" id="stageScene" aria-hidden="true"></div>
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="stage-mood" id="stageMood" aria-hidden="true"></div>
        <div class="particles" id="stageParticles" aria-hidden="true"></div>
        <div class="stage-top">
          <span class="stage-age" id="stageAge">生まれた日</span>
          <span class="stage-stage" id="stageStage">子猫</span>
          <span class="stage-form" id="stageForm" hidden></span>
          <span class="stage-place" id="stagePlace">あたたかいおうち</span>
        </div>
        <div class="cat-actor" id="catActor" role="button" tabindex="0" aria-label="猫をタップして反応を見る"></div>
        <div class="stage-toast" id="stageToast" aria-live="polite"></div>
        <div class="stats" id="stats"></div>
      </div>

      <div class="age-ruler" id="ageRuler" aria-hidden="true">
        <div class="age-track"><i class="age-fill" id="ageFill"></i></div>
        <div class="age-ticks" id="ageTicks"></div>
        <span class="age-marker" id="ageMarker">🐾</span>
      </div>
      <p class="tap-hint" id="tapHint">🐾 猫をタップすると反応するよ</p>

      <div class="page-wrap" id="pageWrap"></div>

      <button class="walk-btn" id="walkBtn">
        <span class="walk-paw" aria-hidden="true">🐾</span>
        <span class="walk-lines">
          <span class="walk-text">猫生を歩む</span>
          <span class="walk-sub" id="walkSub">1歩すすむ</span>
        </span>
        <span class="walk-shine" aria-hidden="true"></span>
      </button>

      <section class="finale" id="finale" hidden>
        <div id="finaleBody"></div>
        <div class="finale-actions">
          <button class="primary" id="againBtn">
            <span class="primary-label">🐾 もう一度生まれ変わる</span>
            <span class="primary-sub">新しい猫生へ</span>
          </button>
          <div class="sub-actions">
            <button class="ghost" id="shareBtn">𝕏 でシェア</button>
            <button class="ghost" id="toDexBtn">図鑑を見る</button>
          </div>
        </div>
      </section>

      <section class="memories" id="memories" hidden>
        <h2 class="memories-title"><span aria-hidden="true">🐾</span> これまでの歩み</h2>
        <div class="memory-list" id="memoryList"></div>
      </section>
    </section>
  </main>

  <!-- 図鑑 -->
  <div class="modal" id="dexModal" hidden>
    <div class="modal-sheet" role="dialog" aria-modal="true" aria-label="転生猫図鑑">
      <div class="modal-head">
        <h2>🐾 転生猫図鑑</h2>
        <button class="close-btn" id="closeDex" aria-label="閉じる">✕</button>
      </div>
      <div class="dex-summary" id="dexSummary"></div>
      <div class="dex-tabs" role="tablist">
        <button class="tab is-active" data-tab="species" role="tab">🐾 種別</button>
        <button class="tab" data-tab="countries" role="tab">🌍 国・地域</button>
        <button class="tab" data-tab="mutations" role="tab">✨ 変異</button>
        <button class="tab" data-tab="achievements" role="tab"><span class="ico">🏆</span>実績・きろく</button>
      </div>
      <div class="dex-body" id="dexBody"></div>
    </div>
  </div>

</div>

<script src="js/data-core.js?v=20261123e"></script>
<script src="js/breeds.js?v=20261123e"></script>
<script src="js/wild.js?v=20261123e"></script>
<script src="js/data-countries.js?v=20261123e"></script>
<script src="js/data.js?v=20261123e"></script>
<script src="js/engine.js?v=20261123e"></script>
<script src="js/catart.js?v=20261123e"></script>
<script src="js/app.js?v=20261123e"></script>
</body>
</html>
